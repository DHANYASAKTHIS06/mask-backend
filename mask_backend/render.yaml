services:
  - type: web
    name: mask-detection-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python train_model.py --csv df.csv"
    startCommand: "gunicorn app:app -c gunicorn.conf.py"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
